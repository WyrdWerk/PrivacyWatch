name: Ops
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Ops task'
        type: choice
        required: true
        options:
          - preflight
          - d1-create
          - secret-put
          - d1-migrate

permissions:
  contents: read

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.inputs.task == 'preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render worker config from Actions variables
        env:
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node scripts/render-worker-config.mjs
      - name: Read-only preflight (no Cloudflare credentials used)
        run: node scripts/ops-preflight.mjs

  d1-create:
    if: github.event.inputs.task == 'd1-create'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Create D1 database privacywatch-index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if npx wrangler d1 create privacywatch-index 2>&1 | tee d1-create-output.json; then
            echo "::notice::D1 database created"
            exit 0
          fi
          if grep -qi 'already exists' d1-create-output.json; then
            echo "::notice::D1 database already exists — safe to continue"
            exit 0
          fi
          echo "::error::D1 database creation failed for a reason other than already-exists"
          exit 1

  secret-put:
    if: github.event.inputs.task == 'secret-put'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render worker config from Actions variables
        env:
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node scripts/render-worker-config.mjs
      - name: Provision GH_REPORT_TOKEN as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_REPORT_TOKEN: ${{ secrets.GH_REPORT_TOKEN }}
        run: printf '%s' "$GH_REPORT_TOKEN" | npx wrangler secret put GH_REPORT_TOKEN -c worker/wrangler.jsonc

  d1-migrate:
    if: github.event.inputs.task == 'd1-migrate'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render worker config from Actions variables
        env:
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node scripts/render-worker-config.mjs
      - name: Apply D1 migrations (Phase 4)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! grep -q '"d1_databases"' worker/wrangler.jsonc; then
            echo "::notice::No d1_databases binding configured yet (Phase 4) — nothing to migrate."
            exit 0
          fi
          npx wrangler d1 migrations apply privacywatch-index -c worker/wrangler.jsonc --remote
